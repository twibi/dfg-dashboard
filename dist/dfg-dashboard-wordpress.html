<style>
/* ==== dfg-dashboard: begin scoped styles (generated) ==== */
/* DFG dashboard – shared styles (no build step, plain CSS)
   Palette: main #005783 · accent #4a927b · background #e9e9e9

   Everything is scoped under `.dfg-root`, every custom property carries the
   `--dfg-` prefix and every internal wrapper uses a `dash-` class, so the
   dashboard can be pasted into a WordPress page (Custom HTML block) without
   inheriting the theme's styles or affecting them. The only rules that are
   not scoped are `:root` (which merely defines namespaced variables —
   harmless) and `body.dfg-standalone`, which only matches the standalone
   site. */
:root {
  --dfg-main: #005783;          /* titles, total line */
  --dfg-main-soft: #eef4f8;     /* tinted callout background */
  --dfg-accent: #4a927b;        /* action buttons, active selectors */
  --dfg-accent-dark: #3d7a66;
  --dfg-ink: #1c2430;
  --dfg-ink-soft: #4b5563;
  --dfg-ink-faint: #6b7280;
  --dfg-bg: #e9e9e9;
  --dfg-card: #ffffff;
  --dfg-line: #dcdfe6;
  --dfg-radius: 10px;
}

/* Standalone site only — WordPress page bodies never carry this class. */
body.dfg-standalone {
  margin: 0;
  min-height: 100vh;
  background: var(--dfg-bg);
}

/* ---------- Isolation root ---------- */
.dfg-root {
  background: transparent;   /* embedded: the theme's one background shows */
  color: var(--dfg-ink);
  font-family: "Segoe UI", Arial, Helvetica, sans-serif;
  line-height: 1.45;
  text-align: left;
}

body.dfg-standalone .dfg-root {
  background: var(--dfg-bg);
  min-height: 100vh;
}

.dfg-root *,
.dfg-root *::before,
.dfg-root *::after { box-sizing: border-box; }

/* ---------- Top bar (standalone only) ---------- */
.dfg-root .dash-topbar {
  background: var(--dfg-card);
  border-bottom: 1px solid var(--dfg-line);
  position: sticky;
  top: 0;
  z-index: 20;
}

.dfg-root .dash-topbar-inner {
  max-width: 1218px;        /* 1178 content + 2 x 20px padding, as on the site */
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}

.dfg-root .dash-brand {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .3px;
  color: var(--dfg-main);
  text-decoration: none;
  padding: 14px 0;
  white-space: nowrap;
}

.dfg-root .dash-brand span { color: var(--dfg-ink-soft); font-weight: 600; }

/* ---------- Page layout ---------- */
/* 1178px is the content width of the WordPress container this is embedded
   in — the dashboard fills it edge to edge, with no margin of its own. */
.dfg-root .dash-page {
  max-width: 1178px;
  margin: 0 auto;
  padding: 0;              /* embedded: flush with the WordPress block */
}

body.dfg-standalone .dfg-root .dash-page {
  max-width: 1218px !important;  /* 1178 content + 2 x 20px padding = the site */
  padding: 26px 20px 60px;
}

.dfg-root .dash-section { margin-bottom: 30px; scroll-margin-top: 72px; }

.dfg-root .dash-head { margin-bottom: 16px; }

/* h1 on the standalone site, h2 when embedded (WordPress owns the h1).
   Font props set explicitly so theme rules on bare h2/h3 tags can't bleed
   in through inheritance-defeating element selectors. */
.dfg-root h1,
.dfg-root h2 {
  font-size: 26px;
  font-family: inherit;
  font-weight: 700;
  font-style: normal;
  margin: 4px 0 6px;
  line-height: 1.25;
  color: var(--dfg-main);
}

.dfg-root .dash-sub {
  font-size: 14.5px;
  color: var(--dfg-ink-soft);
  margin: 0 0 12px;
}

.dfg-root .dash-insight {
  background: var(--dfg-main-soft);
  border-left: 4px solid var(--dfg-main);
  padding: 10px 14px;
  border-radius: 0 var(--dfg-radius) var(--dfg-radius) 0;
  font-size: 14.5px;
  color: var(--dfg-ink);
}

/* ---------- Level switch (above the card) ---------- */
.dfg-root .dash-levelbar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 20px;
  align-items: flex-end;
  margin-bottom: 16px;
}

/* ---------- Filter card rows ---------- */
.dfg-root .dash-row {
  display: flex;
  gap: 14px 16px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.dfg-root .dash-row + .dash-row {
  padding-top: 14px;
  margin-top: 14px;
  border-top: 1px solid var(--dfg-line);
}

.dfg-root .dash-group { display: flex; flex-direction: column; gap: 6px; }

.dfg-root .dash-group.grow { flex: 1 1 auto; min-width: 0; }

.dfg-root .dash-label {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 8px;
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--dfg-ink-faint);
}

/* show / hide the total line */
.dfg-root .dash-check {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 13.5px;
  color: var(--dfg-ink);
  cursor: pointer;
  user-select: none;
  padding: 5px 0;
}

.dfg-root .dash-chk {
  width: 16px;
  height: 16px;
  margin: 0;
  flex: none;
  accent-color: var(--dfg-main);
  cursor: pointer;
}

/* placeholder note shown where institution pills do not exist yet */
.dfg-root .dash-note {
  font-size: 12.5px;
  font-weight: 500;
  text-transform: none;
  letter-spacing: normal;
  color: var(--dfg-ink-faint);
  font-style: italic;
}

.dfg-root .dash-seg { display: inline-flex; }

.dfg-root .dash-seg-btn {
  font: inherit;
  font-size: 12.5px;
  padding: 6px 9px;
  border: 1px solid var(--dfg-line);
  background: #fff;
  color: var(--dfg-ink-soft);
  border-radius: 0;
  margin-left: -1px;
  cursor: pointer;
  white-space: nowrap;
}

.dfg-root .dash-seg .dash-seg-btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.dfg-root .dash-seg .dash-seg-btn:last-child { border-radius: 0 6px 6px 0; }
.dfg-root .dash-seg .dash-seg-btn:only-child { border-radius: 6px; }

.dfg-root .dash-seg .dash-seg-btn.on {
  background: var(--dfg-accent);
  border-color: var(--dfg-accent);
  color: #fff;
  font-weight: 600;
  z-index: 1;
}

.dfg-root .dash-seg-btn:hover:not(.on):not(:disabled) { border-color: var(--dfg-accent); }

.dfg-root .dash-seg-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

/* ---------- Institution pills ---------- */
.dfg-root .dash-pill-line {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  flex-wrap: wrap;
}

.dfg-root .dash-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  flex: 1 1 auto;
  min-width: 0;
}

.dfg-root .dash-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--dfg-line);
  background: #fff;
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 12px;
  cursor: pointer;
  user-select: none;
  color: var(--dfg-ink-soft);
  font-family: inherit;
  line-height: 1.3;
}

.dfg-root .dash-pill:hover { border-color: var(--dfg-accent); }

.dfg-root .dash-pill.on {
  border-color: transparent;
  background: var(--dfg-main-soft);
  color: var(--dfg-ink);
  font-weight: 600;
}

/* the dot is the chart's colour key now (the charts carry no legend), so it
   is a shade bigger than a bare list bullet */
.dfg-root .dash-pill .dash-dot {
  width: 9.5px;
  height: 9.5px;
  border-radius: 50%;
  background: #c9cfda;
  flex: none;
}

.dfg-root .dash-pill.on .dash-dot {
  background: var(--dfg-pill, #fff);
  box-shadow: 0 0 0 1.5px #fff;
}

.dfg-root .dash-pill-actions { display: flex; gap: 6px; flex: none; }

.dfg-root .dash-mini {
  border: 1px solid var(--dfg-line);
  background: #fff;
  color: var(--dfg-ink-soft);
  font-size: 12px;
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
  font-family: inherit;
}

.dfg-root .dash-mini:hover { background: #f6f7f9; border-color: var(--dfg-accent); }

/* ---------- Years / selects ---------- */
.dfg-root .dash-years { display: flex; align-items: center; gap: 8px; }

.dfg-root .dash-sep { color: var(--dfg-ink-faint); }

.dfg-root select.dash-select {
  font: inherit;
  font-size: 13.5px;
  padding: 6px 10px;
  border: 1px solid var(--dfg-line);
  border-radius: 6px;
  background: #fff;
  color: var(--dfg-ink);
}

.dfg-root .dash-spacer { flex: 1 1 auto; min-width: 0; }

/* the actions hug the right edge when the row has spare room, and stay
   right-aligned on their own line when everything wraps */
.dfg-root .dash-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  white-space: nowrap;
  margin-left: auto;
}

.dfg-root .dash-btn {
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  border-radius: 7px;
  padding: 8px 16px;
  cursor: pointer;
  border: 1px solid var(--dfg-line);
  background: #fff;
  color: var(--dfg-ink-soft);
  font-family: inherit;
}

.dfg-root .dash-btn:hover { background: #f6f7f9; }

.dfg-root .dash-btn.primary {
  background: var(--dfg-accent);
  border-color: var(--dfg-accent);
  color: #fff;
}

.dfg-root .dash-btn.primary:hover {
  background: var(--dfg-accent-dark);
  border-color: var(--dfg-accent-dark);
}

/* ---------- PNG export dialog ---------- */
/* Modal, so it draws above the page in its own layer: it carries its own
   panel styling instead of inheriting whatever the host theme uses. */
.dfg-root dialog.dash-dlg {
  position: fixed;
  inset: 0;
  height: fit-content;
  margin: auto;
  width: min(420px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  overflow: auto;
  padding: 20px 22px;
  border: 1px solid var(--dfg-line);
  border-radius: var(--dfg-radius);
  background: var(--dfg-card);
  color: var(--dfg-ink);
  font-family: inherit;
  font-size: 14px;
  text-align: left;
  box-shadow: 0 18px 48px rgba(16, 24, 40, .28);
}

/* the UA's own hiding must survive a theme that paints every element */
.dfg-root dialog.dash-dlg:not([open]) { display: none; }

.dfg-root dialog.dash-dlg::backdrop { background: rgba(16, 24, 40, .5); }

.dfg-root .dash-dlg-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--dfg-main);
  margin: 0 0 14px;
}

.dfg-root .dash-dlg .dash-label { margin-bottom: 5px; }

.dfg-root .dash-dlg-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

/* ---------- Chart card ---------- */
.dfg-root .dash-card {
  background: var(--dfg-card);
  border: 1px solid var(--dfg-line);
  border-radius: var(--dfg-radius);
  padding: 18px 20px 16px;
  box-shadow: 0 1px 3px rgba(16, 24, 40, .05);
}

.dfg-root .dash-caption {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  font-size: 13px;
  color: var(--dfg-ink-soft);
  margin: 16px 0 4px;
}

.dfg-root .dash-caption b { color: var(--dfg-ink); font-weight: 600; }

.dfg-root .dash-caption .warn { color: var(--dfg-accent); font-weight: 600; }

/* footnote sitting directly under the chart */
.dfg-root .dash-foot {
  margin: 14px 0 0;
  padding-top: 10px;
  border-top: 1px dashed var(--dfg-line);
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--dfg-ink-faint);
}

/* first line of the footnote block: the unit the table is expressed in */
.dfg-root .dash-unit {
  display: block;
  font-weight: 600;
  color: var(--dfg-ink-soft);
  margin-bottom: 3px;
}

/* data provenance, the last line of the footnote block */
.dfg-root .dash-src {
  display: block;
  margin-top: 4px;
}

/* ---------- data table — the chart's numbers in rows ---------- */
.dfg-root .dash-table {
  margin-top: 18px;
  overflow-x: auto;   /* the table scrolls sideways on narrow screens */
}

.dfg-root .dash-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  white-space: nowrap;
}

.dfg-root .dash-tbl th,
.dfg-root .dash-tbl td {
  padding: 7px;
  border-bottom: 1px solid var(--dfg-line);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.dfg-root .dash-tbl thead th {
  background: var(--dfg-main-soft);
  color: var(--dfg-main);
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.dfg-root .dash-tbl thead th:first-child { text-align: left; }

/* every header is a click-to-sort button. The cell keeps its font, size,
   case and alignment — the button only adds the pointer and the arrow,
   so nothing about the table's metrics changes. */
.dfg-root .dash-tbl .dash-sort {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  font-family: inherit;
  font-size: inherit;
  font-weight: inherit;
  font-style: inherit;
  line-height: inherit;
  color: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  text-align: inherit;
  cursor: pointer;
}
.dfg-root .dash-tbl .dash-sort:hover { text-decoration: underline; }
.dfg-root .dash-tbl .dash-sort:focus-visible {
  outline: 2px solid var(--dfg-main);
  outline-offset: 2px;
}
.dfg-root .dash-tbl .dash-sort-ico {
  font-size: 9px;
  line-height: 1;
  opacity: .5;
}
.dfg-root .dash-tbl th[aria-sort] .dash-sort-ico { opacity: 1; }

/* the name column stays visible when the table scrolls sideways.
   Names are the FULL institution names here: a fixed 280px column lets them
   wrap onto (at most) two lines instead of pushing the table wider. */
.dfg-root .dash-tbl tbody tr { height: 48px; }   /* two lines of name */

.dfg-root .dash-tbl th[scope="row"] {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--dfg-card);
  text-align: left;
  font-weight: 600;
  color: var(--dfg-ink);
  width: 280px;
  min-width: 280px;
  max-width: 280px;
  white-space: normal;
  line-height: 1.35;
  vertical-align: middle;
}

/* the same colour key as the pill dot, at the same size */
.dfg-root .dash-tbl-dot {
  display: inline-block;
  width: 9.5px;
  height: 9.5px;
  border-radius: 50%;
  margin-right: 7px;
  vertical-align: baseline;
}

.dfg-root .dash-tbl tbody tr:hover > th,
.dfg-root .dash-tbl tbody tr:hover > td { background: #f5f7fa; }

.dfg-root .dash-tbl .is-total > th,
.dfg-root .dash-tbl .is-total > td {
  font-weight: 700;
  color: var(--dfg-main);
  border-top: 2px solid var(--dfg-main);
}

.dfg-root .dash-tbl .is-ctx > th,
.dfg-root .dash-tbl .is-ctx > td {
  color: var(--dfg-ink-soft);
  border-top: 1px dashed var(--dfg-line);
}

.dfg-root .dash-chart { position: relative; height: 470px !important; }

/* the stacked bar chart sits directly under the line chart */
.dfg-root .dash-chart2 { margin-top: 24px; }

/* what the PNG button exports */
.dfg-root select.dash-png { max-width: 178px; }

.dfg-root .dash-empty {
  display: none;
  position: absolute;
  inset: 0;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 30px;
  color: var(--dfg-ink-faint);
  font-size: 15px;
  line-height: 1.6;
  background: var(--dfg-card);   /* fully covers the chart underneath */
}

/* =========================================================================
   Hardening against a hostile host page.

   WordPress themes and page builders routinely ship bare-element rules
   carrying !important (`button { font-size: 20px !important }`,
   `h2 { color: red !important; text-transform: uppercase }`). Specificity
   alone cannot win against those, so the handful of properties that carry
   the dashboard's identity are restated here with !important.

   Everything below is still scoped to `.dfg-root`, so this layer changes
   nothing outside the dashboard — the guarantee is one-directional: the
   theme cannot restyle us, and we cannot restyle the theme.
   ========================================================================= */

.dfg-root,
.dfg-root p,
.dfg-root span,
.dfg-root b,
.dfg-root li,
.dfg-root button,
.dfg-root select {
  font-family: "Segoe UI", Arial, Helvetica, sans-serif !important;
}

.dfg-root {
  font-size: 16px !important;
  line-height: 1.45 !important;
  text-align: left !important;
}

/* layout boxes a page builder could plausibly target (`section`, `.card`) */
.dfg-root .dash-page {
  max-width: 1178px !important;
  margin-left: auto !important;
  margin-right: auto !important;
}

body.dfg-standalone .dfg-root .dash-page {
  max-width: 1218px !important;
}

.dfg-root .dash-card {
  padding: 18px 20px 16px !important;
  border: 1px solid var(--dfg-line) !important;
  border-radius: var(--dfg-radius) !important;
  background: var(--dfg-card) !important;
}

.dfg-root .dash-insight {
  padding: 10px 14px !important;
  border: 0 !important;
  border-left: 4px solid var(--dfg-main) !important;
  border-radius: 0 var(--dfg-radius) var(--dfg-radius) 0 !important;
}

/* headings — the theme owns the page's h1, we own ours */
.dfg-root h1,
.dfg-root h2 {
  font-size: 26px !important;
  font-weight: 700 !important;
  font-style: normal !important;
  line-height: 1.25 !important;
  margin: 4px 0 6px !important;
  padding: 0 !important;
  border: 0 !important;
  color: var(--dfg-main) !important;
  text-transform: none !important;
  letter-spacing: normal !important;
  text-align: left !important;
}

/* labels and captions */
.dfg-root .dash-label {
  font-size: 11.5px !important;
  font-weight: 700 !important;
  text-transform: uppercase !important;
  letter-spacing: .6px !important;
  color: var(--dfg-ink-faint) !important;
}

.dfg-root .dash-check {
  font-size: 13.5px !important;
  line-height: normal !important;
  color: var(--dfg-ink) !important;
  text-transform: none !important;
  letter-spacing: normal !important;
}

.dfg-root .dash-chk {
  width: 16px !important;
  height: 16px !important;
  margin: 0 !important;
  accent-color: var(--dfg-main) !important;
}

.dfg-root .dash-note {
  font-size: 12.5px !important;
  font-style: italic !important;
  text-transform: none !important;
  letter-spacing: normal !important;
  color: var(--dfg-ink-faint) !important;
}

.dfg-root .dash-sub {
  font-size: 14.5px !important;
  line-height: 1.45 !important;
  text-align: left !important;
  color: var(--dfg-ink-soft) !important;
}

.dfg-root .dash-insight {
  font-size: 14.5px !important;
  line-height: 1.45 !important;
  text-align: left !important;
  color: var(--dfg-ink) !important;
  background: var(--dfg-main-soft) !important;
}

.dfg-root .dash-caption {
  font-size: 13px !important;
  line-height: 1.45 !important;
  text-align: left !important;
  color: var(--dfg-ink-soft) !important;
}

.dfg-root .dash-foot {
  display: block !important;
  margin: 14px 0 0 !important;
  padding-top: 10px !important;
  font-size: 12.5px !important;
  line-height: 1.5 !important;
  text-align: left !important;
  color: var(--dfg-ink-faint) !important;
}

.dfg-root .dash-unit {
  display: block !important;
  font-weight: 600 !important;
  color: var(--dfg-ink-soft) !important;
  margin-bottom: 3px !important;
}

.dfg-root .dash-src {
  display: block !important;
  margin-top: 4px !important;
}

/* data table */
.dfg-root .dash-table {
  margin-top: 18px !important;
  overflow-x: auto !important;
}

.dfg-root .dash-tbl {
  width: 100% !important;
  border-collapse: collapse !important;
  font-size: 12.5px !important;
  white-space: nowrap !important;
}

.dfg-root .dash-tbl th,
.dfg-root .dash-tbl td {
  padding: 7px !important;
  border-bottom: 1px solid var(--dfg-line) !important;
  text-align: right !important;
  font-weight: 400 !important;
  color: var(--dfg-ink) !important;
}

.dfg-root .dash-tbl thead th {
  background: var(--dfg-main-soft) !important;
  color: var(--dfg-main) !important;
  font-size: 11.5px !important;
  font-weight: 700 !important;
  text-align: right !important;
}

.dfg-root .dash-tbl thead th:first-child,
.dfg-root .dash-tbl th[scope="row"] { text-align: left !important; }

/* themes ship bare `button { font-size: 20px !important }` rules — the
   header buttons have to win against those, so they are restated here */
.dfg-root .dash-tbl .dash-sort {
  display: inline-flex !important;
  align-items: baseline !important;
  gap: 5px !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: none !important;
  background-color: transparent !important;
  font-family: inherit !important;
  font-size: inherit !important;
  font-weight: inherit !important;
  font-style: inherit !important;
  line-height: inherit !important;
  color: inherit !important;
  letter-spacing: inherit !important;
  text-transform: inherit !important;
  text-align: inherit !important;
  cursor: pointer !important;
}
.dfg-root .dash-tbl .dash-sort:hover { text-decoration: underline !important; }
.dfg-root .dash-tbl .dash-sort:focus-visible {
  outline: 2px solid var(--dfg-main) !important;

.dfg-root .dash-seg .dash-seg-btn.on {
